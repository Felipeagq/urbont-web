version: 1
frontend:
  phases:
    preBuild:
      commands:
        # `npm ci` exige package-lock.json commiteado — builds reproducibles.
        # El proyecto original no tenía lockfile: cada despliegue resolvía
        # versiones distintas dentro de los rangos ^.
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    # Next.js SSR en Amplify (WEB_COMPUTE) publica el directorio .next.
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
